services:
  - type: web
    name: klypso
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 web_app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/klypso.sqlite3
      - key: STORAGE_PATH
        value: /opt/render/project/src/storage
      - key: MAX_CONTENT_LENGTH_MB
        value: "512"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_ULTRA_PRICE_ID
        sync: false
      - key: STRIPE_PRO_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_ULTRA_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_TRIAL_DAYS
        value: "10"
      - key: STRIPE_SUCCESS_URL
        value: https://klypso-2pjf.onrender.com/subscription?success=1
      - key: STRIPE_CANCEL_URL
        value: https://klypso-2pjf.onrender.com/pricing?cancelled=1
      - key: STRIPE_PORTAL_RETURN_URL
        value: https://klypso-2pjf.onrender.com/subscription
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: EMAIL_SMTP_HOST
        value: smtp.gmail.com
      - key: EMAIL_SMTP_PORT
        value: "587"
      - key: EMAIL_SMTP_USER
        sync: false
      - key: EMAIL_SMTP_PASSWORD
        sync: false
      - key: EMAIL_SMTP_FROM
        sync: false
      - key: EMAIL_SMTP_TLS
        value: "true"
      - key: EMAIL_OTP_MINUTES
        value: "10"
      - key: PUBLIC_BASE_URL
        value: https://klypso-2pjf.onrender.com
      - key: FREE_DAILY_CREDITS
        value: "3"
      - key: PRO_DAILY_CREDITS
        value: "12"
      - key: ULTRA_DAILY_CREDITS
        value: "24"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_1
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: AI_PROVIDER_ORDER
        value: gemini,groq,openrouter
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: PRO_ANNUAL_PRICE_EUR
        value: ""
      - key: ULTRA_ANNUAL_PRICE_EUR
        value: ""
