name: KLYPSO — 88 scenario tests
on:
  push:
    paths:
      - "Klypso-V11-GITHUB-ROOT/**"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Klypso-V11-GITHUB-ROOT
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python compile check
        run: python -m py_compile web_app.py klypso/__init__.py klypso/ai_api.py klypso/clips/intelligence.py klypso/clips/renderer.py klypso/clips/pipeline.py klypso/clips/__init__.py

      - name: JavaScript syntax check
        run: |
          node --check static/js/app.js
          node --check static/js/v11.js
          node --check static/js/v14.js
          node --check static/js/studio.js
          node --check static/js/project-create.js
          node --check static/js/ai-clips.js

      - name: CSS structure check
        run: python -c "from pathlib import Path; css=Path('static/css/v14.css').read_text(encoding='utf-8'); assert css.count('{')==css.count('}'), 'Unbalanced CSS braces'; assert css.count('(')==css.count(')'), 'Unbalanced CSS parentheses'; print('CSS structure OK')"

      - name: Run 88 scenarios
        run: pytest -q tests/test_50_scenarios.py
