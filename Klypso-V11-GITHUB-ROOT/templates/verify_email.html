{% extends 'base.html' %}
{% block title %}Code de vérification — KLYPSO{% endblock %}
{% block content %}
<section class="form-page auth-v12"><div class="auth-card narrow">
<span class="eyebrow-v11">VÉRIFICATION</span><h1>Entre ton code.</h1>
<p class="auth-lead">Un code à 6 chiffres a été envoyé à <strong>{{ email }}</strong>.</p>
<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" placeholder="123456"></label>
<button class="button button-lg full" type="submit">Vérifier et continuer →</button></form>
<p class="auth-foot">Code valable {{ config.EMAIL_OTP_MINUTES }} minutes.</p>
</div></section>
{% endblock %}
