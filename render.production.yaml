# Production Blueprint for KLYPSO.
# This file is intentionally separate from the current free Render service.
# It requires paid compute, a durable Render Postgres database, and an
# S3-compatible bucket (AWS S3 / Cloudflare R2 / compatible).
services:
  - type: web
    name: klypso-web
    runtime: python
    plan: starter
    region: oregon
    repo: https://github.com/arthurmuska-tech/Klypso
    branch: main
    rootDir: Klypso-V11-GITHUB-ROOT
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 900 --graceful-timeout 120 web_app:app
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: klypso-db
          property: connectionString
      - key: STORAGE_PATH
        value: /tmp/klypso-cache
      - key: MAX_CONTENT_LENGTH_MB
        value: "4096"
      - key: AI_WORKER_MODE
        value: external
      - key: REQUIRE_POSTGRES
        value: "true"
      - key: REQUIRE_OBJECT_STORAGE
        value: "true"
      - key: JOB_STALE_SECONDS
        value: "1800"
      - key: JOB_MAX_ATTEMPTS
        value: "3"
      - key: WORKER_HEARTBEAT_SECONDS
        value: "30"
      - key: TRIAL_DAYS
        value: "14"
      - key: STRIPE_TRIAL_DAYS
        value: "14"
      - key: POSTGRES_POOL_MAX_SIZE
        value: "12"
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_ULTRA_PRICE_ID
        sync: false
      - key: STRIPE_PRO_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_ULTRA_ANNUAL_PRICE_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false

  - type: worker
    name: klypso-ai-worker
    runtime: python
    plan: starter
    region: oregon
    repo: https://github.com/arthurmuska-tech/Klypso
    branch: main
    rootDir: Klypso-V11-GITHUB-ROOT
    buildCommand: pip install -r requirements.txt
    startCommand: python -m klypso.worker
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: klypso-db
          property: connectionString
      - key: STORAGE_PATH
        value: /tmp/klypso-cache
      - key: AI_WORKER_MODE
        value: external
      - key: POSTGRES_POOL_MAX_SIZE
        value: "8"
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false

databases:
  - name: klypso-db
    plan: basic_256mb
    region: oregon
